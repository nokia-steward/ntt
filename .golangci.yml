version: "2"
run:
  tests: false
  allow-parallel-runners: true
linters:
  # The standard set (errcheck, govet, ineffassign, staticcheck, unused)
  # and a few more that find mistakes rather than style.
  enable:
    - dupword
    - errorlint
    - goprintffuncname
    - makezero
    - misspell
    - unconvert
    - wastedassign
  settings:
    misspell:
      ignore-rules:
        # `thn` names a branch's then-block, `forhead` a for loop's head.
        - thn
        - forhead
    govet:
      disable:
        # Suggests inlining deprecated wrappers; a modernisation, not a
        # mistake.
        - inline
    staticcheck:
      checks:
        - all
        # Quick fixes are suggestions; the others are staticcheck's own
        # default exclusions.
        - -QF*
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - .*_gen.go$
      - internal/env
      - internal/fs
      - internal/loc
      - internal/lsp/fakenet
      - internal/lsp/helper
      - internal/lsp/jsonrpc2
      - internal/lsp/protocol
      - internal/lsp/span
      - internal/lsp/telemetry
      - internal/lsp/xcontext
      - internal/memoize
      - internal/session/flock
      - ttcn3/v2/syntax/internal/gen
      - ttcn3/syntax/internal/gen
      - ttcn3/printer
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 3
  new: false
  fix: false
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
