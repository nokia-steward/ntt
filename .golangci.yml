version: "2"
run:
  issues-exit-code: 0
  tests: false
  allow-parallel-runners: true
linters:
  enable:
    - dupl
    - dupword
    - errname
    - errorlint
    - exhaustive
    - exhaustruct_v5
    - forcetypeassert
    - gocognit
    - goconst
    - gocritic
    - godot
    - godox
    - goprintffuncname
    - gosec
    - ireturn
    - maintidx
    - makezero
    - misspell
    - mnd
    - nestif
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - usestdlibvars
    - varnamelen
    - wastedassign
    - wrapcheck
  settings:
    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - .*_gen.go$
      - internal/env
      - internal/fs
      - internal/loc
      - internal/lsp/fakenet
      - internal/lsp/helper
      - internal/lsp/jsonrpc2
      - internal/lsp/protocol
      - internal/lsp/span
      - internal/lsp/telemetry
      - internal/lsp/xcontext
      - internal/memoize
      - internal/session/flock
      - ttcn3/syntax/internal/gen
      - ttcn3/printer
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 3
  new: false
  fix: false
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
