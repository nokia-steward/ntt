# Module configuration for the live-testing example.
#
# The [TESTPORT_PARAMETERS] block below is all it takes to bind the TTCN-3
# port `p` to a real TCP endpoint: no Go code, no C test port. Declaring an
# external transport also switches the run to the real clock, so timers
# pace real I/O.
#
# Key syntax is `<component>.<port>.<param>`; `*` matches any component.
# See docs/live-testing-and-profiling.md for every recognised parameter
# (address / host+port, dial_timeout, framing) and per-component addresses.

[TESTPORT_PARAMETERS]
*.p.transport := "tcp"
*.p.host      := "127.0.0.1"
*.p.port      := "19000"

[EXECUTE]
app.tc_echo
app.tc_latency_budget
