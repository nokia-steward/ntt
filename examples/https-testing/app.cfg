# Binds the TTCN-3 ports in app.ttcn to a live HTTPS endpoint. No Go code.
#
# Key syntax is `<component>.<port>.<param>`; `*` matches any component.
# See docs/live-testing-and-profiling.md for every recognised parameter
# (base_url / scheme+host+port, timeout, ca_cert, client_cert, client_key,
# server_name, insecure_skip_verify) and per-component base URLs.

[TESTPORT_PARAMETERS]
*.p.transport := "http"
*.p.base_url  := "https://127.0.0.1:19443"

# The stand-in SUT in README.md generates a self-signed certificate at
# startup, so there is no CA to verify it against. Skipping verification is
# appropriate for a local example and prints a warning each run; against a
# real service, point ca_cert at its CA instead and delete this line.
*.p.insecure_skip_verify := "true"

[EXECUTE]
app.tc_health
app.tc_reports_status
app.tc_load
app.tc_latency_budget
